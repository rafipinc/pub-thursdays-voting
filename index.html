<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pub Thursdays — Ratings</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 32px 16px; }
  h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 4px; letter-spacing: -0.5px; }
  h1 span { color: #bf4f24; }
  .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 32px; }

  /* Summary cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .stat { background: #16213e; border-radius: 14px; padding: 16px; text-align: center; border: 1px solid #ffffff0f; }
  .stat-val { font-size: 28px; font-weight: 800; color: #bf4f24; }
  .stat-label { font-size: 12px; color: #888; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Pub leaderboard */
  .section-title { font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .pubs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .pub-row { background: #16213e; border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; border: 1px solid #ffffff0f; }
  .pub-rank { font-size: 20px; font-weight: 800; color: #bf4f24; min-width: 32px; }
  .pub-rank.gold { color: #f5c518; }
  .pub-rank.silver { color: #aaa; }
  .pub-rank.bronze { color: #cd7f32; }
  .pub-info { flex: 1; }
  .pub-name { font-size: 15px; font-weight: 700; }
  .pub-meta { font-size: 12px; color: #888; margin-top: 2px; }
  .pub-avg { font-size: 22px; font-weight: 800; color: #fff; text-align: right; }
  .pub-avg span { font-size: 12px; color: #888; font-weight: 400; }
  .bar-wrap { margin-top: 8px; background: #ffffff10; border-radius: 4px; height: 6px; overflow: hidden; }
  .bar { height: 6px; border-radius: 4px; background: linear-gradient(90deg, #bf4f24, #e8834f); transition: width 0.8s ease; }

  /* Full ratings table */
  .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid #ffffff0f; }
  table { width: 100%; border-collapse: collapse; background: #16213e; }
  thead th { background: #0f3460; padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; white-space: nowrap; }
  tbody tr { border-top: 1px solid #ffffff08; transition: background 0.15s; }
  tbody tr:hover { background: #ffffff08; }
  td { padding: 12px 16px; font-size: 14px; white-space: nowrap; }
  .rating-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-weight: 700; font-size: 13px; }
  .r-high { background: #1b4332; color: #52b788; }
  .r-mid  { background: #3a2f0f; color: #f5c518; }
  .r-low  { background: #3b1010; color: #e07070; }
  .voter-chip { display: inline-block; background: #ffffff10; border-radius: 20px; padding: 3px 10px; font-size: 12px; color: #ccc; }
  .picked-by { color: #bf4f24; font-weight: 600; font-size: 12px; }

  @media (max-width: 480px) {
    .pub-rank { font-size: 16px; }
    .pub-avg { font-size: 18px; }
  }
</style>
</head>
<body>

<h1>🍺 Pub <span>Thursdays</span></h1>
<p class="subtitle">Round 3 ratings &mdash; as of 16 September 2026</p>

<!-- Summary stats -->
<div class="stats">
  <div class="stat"><div class="stat-val">6</div><div class="stat-label">Pubs Visited</div></div>
  <div class="stat"><div class="stat-val">26</div><div class="stat-label">Ratings Cast</div></div>
  <div class="stat"><div class="stat-val">6.3</div><div class="stat-label">Overall Avg</div></div>
  <div class="stat"><div class="stat-val">6</div><div class="stat-label">Members</div></div>
</div>

<!-- Pub leaderboard -->
<p class="section-title">Pub Leaderboard</p>
<div class="pubs" id="pubs"></div>

<!-- Full table -->
<p class="section-title">All Ratings</p>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Pub</th>
        <th>Picked By</th>
        <th>Voter</th>
        <th>Rating</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
var ratings = [
  { date: '10 Sep', pub: 'Mercantile Hotel',                   picked: 'Rups',              voter: 'Brun',              r: 7 },
  { date: '10 Sep', pub: 'Mercantile Hotel',                   picked: 'Rups',              voter: 'Grippy McCarroll',  r: 7 },
  { date: '10 Sep', pub: 'Mercantile Hotel',                   picked: 'Rups',              voter: 'Hardon Eddie',      r: 7 },
  { date: '10 Sep', pub: 'Mercantile Hotel',                   picked: 'Rups',              voter: 'Jordy Pordy',       r: 7 },
  { date: '10 Sep', pub: 'Mercantile Hotel',                   picked: 'Rups',              voter: 'Rafi',              r: 0 },
  { date: '13 Aug', pub: 'Hyde Park House',                    picked: 'Hardon Eddie',      voter: 'Brun',              r: 8 },
  { date: '13 Aug', pub: 'Hyde Park House',                    picked: 'Hardon Eddie',      voter: 'Grippy McCarroll',  r: 7 },
  { date: '13 Aug', pub: 'Hyde Park House',                    picked: 'Hardon Eddie',      voter: 'Rafi',              r: 8 },
  { date: '6 Aug',  pub: 'The Light Brigade',                  picked: 'Rafi',              voter: 'Brun',              r: 7 },
  { date: '6 Aug',  pub: 'The Light Brigade',                  picked: 'Rafi',              voter: 'Grippy McCarroll',  r: 7 },
  { date: '6 Aug',  pub: 'The Light Brigade',                  picked: 'Rafi',              voter: 'Hardon Eddie',      r: 8 },
  { date: '6 Aug',  pub: 'The Light Brigade',                  picked: 'Rafi',              voter: 'Rups',              r: 7 },
  { date: '23 Jul', pub: 'East Village Hotel Sydney',          picked: 'Brun',              voter: 'Grippy McCarroll',  r: 8 },
  { date: '23 Jul', pub: 'East Village Hotel Sydney',          picked: 'Brun',              voter: 'Hardon Eddie',      r: 7 },
  { date: '23 Jul', pub: 'East Village Hotel Sydney',          picked: 'Brun',              voter: 'Jordy Pordy',       r: 6 },
  { date: '23 Jul', pub: 'East Village Hotel Sydney',          picked: 'Brun',              voter: 'Rafi',              r: 8 },
  { date: '23 Jul', pub: 'East Village Hotel Sydney',          picked: 'Brun',              voter: 'Rups',              r: 7 },
  { date: '9 Jul',  pub: 'The Belroy Hotel',                   picked: 'Jordy Pordy',       voter: 'Brun',              r: 6 },
  { date: '9 Jul',  pub: 'The Belroy Hotel',                   picked: 'Jordy Pordy',       voter: 'Grippy McCarroll',  r: 0 },
  { date: '9 Jul',  pub: 'The Belroy Hotel',                   picked: 'Jordy Pordy',       voter: 'Hardon Eddie',      r: 5 },
  { date: '9 Jul',  pub: 'The Belroy Hotel',                   picked: 'Jordy Pordy',       voter: 'Rafi',              r: 5 },
  { date: '9 Jul',  pub: 'The Belroy Hotel',                   picked: 'Jordy Pordy',       voter: 'Rups',              r: 6 },
  { date: '2 Jul',  pub: 'The Captain Cook Hotel Paddington',  picked: 'Grippy McCarroll',  voter: 'Brun',              r: 7 },
  { date: '2 Jul',  pub: 'The Captain Cook Hotel Paddington',  picked: 'Grippy McCarroll',  voter: 'Hardon Eddie',      r: 7 },
  { date: '2 Jul',  pub: 'The Captain Cook Hotel Paddington',  picked: 'Grippy McCarroll',  voter: 'Jordy Pordy',       r: 0 },
  { date: '2 Jul',  pub: 'The Captain Cook Hotel Paddington',  picked: 'Grippy McCarroll',  voter: 'Rafi',              r: 6 },
  { date: '2 Jul',  pub: 'The Captain Cook Hotel Paddington',  picked: 'Grippy McCarroll',  voter: 'Rups',              r: 7 },
];

// Build leaderboard
var pubMap = {};
ratings.forEach(function(r) {
  if (!pubMap[r.pub]) pubMap[r.pub] = { name: r.pub, date: r.date, picked: r.picked, total: 0, count: 0 };
  pubMap[r.pub].total += r.r;
  pubMap[r.pub].count++;
});
var pubs = Object.values(pubMap).map(function(p) {
  return { name: p.name, date: p.date, picked: p.picked, avg: p.total / p.count, count: p.count };
}).sort(function(a, b) { return b.avg - a.avg; });

var rankColors = ['gold', 'silver', 'bronze'];
var rankEmoji = ['🥇', '🥈', '🥉'];
var pubsEl = document.getElementById('pubs');
pubs.forEach(function(p, i) {
  var pct = (p.avg / 10 * 100).toFixed(0);
  var rankClass = rankColors[i] || '';
  var medal = rankEmoji[i] || (i + 1);
  pubsEl.innerHTML += [
    '<div class="pub-row">',
    '<div class="pub-rank ' + rankClass + '">' + medal + '</div>',
    '<div class="pub-info">',
    '<div class="pub-name">' + p.name + '</div>',
    '<div class="pub-meta">' + p.date + ' &middot; ' + p.count + ' ratings &middot; Picked by <span style="color:#bf4f24">' + p.picked + '</span></div>',
    '<div class="bar-wrap"><div class="bar" style="width:' + pct + '%"></div></div>',
    '</div>',
    '<div class="pub-avg">' + p.avg.toFixed(1) + '<br><span>/10</span></div>',
    '</div>'
  ].join('');
});

// Build table
var tbody = document.getElementById('tbody');
ratings.forEach(function(r) {
  var cls = r.r >= 7 ? 'r-high' : r.r >= 5 ? 'r-mid' : 'r-low';
  var tr = document.createElement('tr');
  tr.innerHTML = [
    '<td>' + r.date + '</td>',
    '<td style="font-weight:600">' + r.pub + '</td>',
    '<td><span class="picked-by">' + r.picked + '</span></td>',
    '<td><span class="voter-chip">' + r.voter + '</span></td>',
    '<td><span class="rating-badge ' + cls + '">' + r.r + '/10</span></td>'
  ].join('');
  tbody.appendChild(tr);
});
</script>
</body>
</html>
